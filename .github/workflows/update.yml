name: Update cask

# Picks up Casks/lorimer.rb from the latest Lorimer release, then installs it on a clean
# macOS runner the way a user would. Polling means the Lorimer repository needs no token
# to write here. Run it by hand to skip the wait after a release.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo asweeney86/lorimer --pattern lorimer.rb --dir new --clobber
          mkdir -p Casks
          if cmp -s new/lorimer.rb Casks/lorimer.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp new/lorimer.rb Casks/lorimer.rb
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/lorimer.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lorimer.rb
          git commit -m "lorimer $version"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  verify:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      # The run starts on the commit that triggered it, which predates the cask the update job
      # just pushed, so check out the tip of main for brew to tap.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install --cask asweeney86/tap/lorimer
      - name: Check the app and the command-line tool
        run: |
          test -d /Applications/Lorimer.app
          if xattr -p com.apple.quarantine /Applications/Lorimer.app 2>/dev/null; then
            echo "Lorimer.app still carries the quarantine flag" >&2
            exit 1
          fi
          lorimer-cli scan "$(mktemp -d)"
      - run: brew uninstall --cask lorimer
